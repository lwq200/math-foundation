<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" aria-label="导数为切线斜率的示意：曲线 f(x)=x² 上割线随 Δx→0 逼近切线，斜率即导数" style="--mf-ink:#2b302e;--mf-muted:#4a554f;--mf-primary:#2f6f4f;--mf-amber:#c9a227"><defs><style>.arrow{stroke:var(--mf-amber);stroke-width:2;fill:none}.label,.label-accent,.label-sm{font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,&quot;Segoe UI&quot;,system-ui,sans-serif}.label{font-size:13px;fill:var(--mf-ink)}.label-accent,.label-sm{font-size:12px}.label-sm{fill:var(--mf-muted)}.label-accent{fill:var(--mf-amber)}</style></defs><text x="320" y="30" style="font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,&quot;Segoe UI&quot;,system-ui,sans-serif;font-size:16px;fill:var(--mf-ink);font-weight:600" text-anchor="middle">导数是切线斜率：割线斜率 Δy/Δx 在 Δx→0 时收敛到 f&apos;(x)</text><path d="M80 480h510m-510 0V60" style="stroke:var(--mf-ink);stroke-width:1.2;fill:none"/><path fill="var(--mf-ink)" d="M586 480h9l-7-7zM80 65v-9l7 7z"/><text x="592" y="498" class="label" text-anchor="middle">x</text><text x="60" y="60" class="label" text-anchor="middle">y</text><text x="80" y="498" class="label-sm" text-anchor="middle">O</text><path d="m140 525 430-340" style="stroke:var(--mf-amber);stroke-width:1.8;stroke-dasharray:7 5;fill:none"/><path d="m150 487.4 350-172.9" style="stroke:var(--mf-primary);stroke-width:2.2;fill:none"/><path d="m80 480 25.5-.95 25.5-2.83 25.5-4.72 25.5-6.6 25.5-8.5L233 446l25.5-12.3 25.5-14.2 25.5-16.1 25.5-17.9 25.5-19.8 25.5-21.8 25.5-23.6 25.5-25.5 25.5-27.4 25.5-29.3 25.5-31.2 25.5-33.1 25.5-34.9L590 102" style="stroke:var(--mf-primary);stroke-width:2.2;fill:none;stroke-linecap:round"/><path d="M454 276.7V480m-204-42v42" style="fill:none;stroke:var(--mf-muted);stroke-width:1;stroke-dasharray:4 4"/><circle cx="250" cy="438" r="5" style="fill:var(--mf-primary);stroke:#fff;stroke-width:1.5"/><circle cx="454" cy="276.7" r="5" style="fill:var(--mf-amber);stroke:#fff;stroke-width:1.5"/><path d="M250 494h198" class="arrow"/><path fill="var(--mf-amber)" d="m454 494-10-5v10z"/><text x="352" y="510" class="label-accent" text-anchor="middle">Δx</text><path d="M468 438V282" class="arrow"/><path fill="var(--mf-amber)" d="m468 276.7-5 10.3h10z"/><text x="484" y="360" class="label-accent">Δy = f(x+Δx) − f(x)</text><path d="M250 480v9m204-9v9" style="stroke:var(--mf-ink);stroke-width:1.2"/><text x="250" y="505" class="label-sm" text-anchor="middle">x</text><text x="454" y="505" class="label-sm" text-anchor="middle">x+Δx</text><text x="262" y="432" class="label">P (x, f(x))</text><text x="462" y="300" class="label-accent">Q (x+Δx, f(x+Δx))</text><text x="270" y="520" class="label-sm">割线斜率 = Δy / Δx</text><text x="170" y="150" class="label-sm">f(x)=x²</text><text x="250" y="230" class="label-accent" text-anchor="middle">Δx→0</text><path stroke-width="1.6" d="M236 240c16 28 64 52 122 60" class="arrow"/><path fill="var(--mf-amber)" d="m364 300-10-2 4 9z"/><text x="120" y="250" class="label-sm" text-anchor="middle">切线斜率 f&apos;(x)</text><text x="120" y="266" class="label-sm" text-anchor="middle">（割线的极限位置）</text></svg>