# 《数学基础》· VitePress 站点自动部署到 GitHub Pages
# 触发：main 分支推送时
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建站点
        run: npm run build
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
